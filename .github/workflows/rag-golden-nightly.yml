# rag-golden-nightly — runs the 11-question RAG regression suite every
# night against real Gemini + real Neon, as an automated safety net for
# answer-quality drift. Non-blocking: fails visibly in the Actions tab,
# does not gate PRs. Real-network Gemini calls are flaky and costly per
# run, so the golden suite stays opt-in for per-PR work and only runs
# on schedule here (or via manual workflow_dispatch for verification).
#
# SETUP (one-time, external to repo):
#   1. Create a Neon CI branch off main:
#        neonctl branches create --name ci --parent main
#        neonctl connection-string ci --pooled
#      (Or via Neon dashboard: Branches → New branch → parent: main →
#      name: ci → copy pooled connection string.)
#   2. Create a Gemini API key in Google AI Studio:
#        https://aistudio.google.com/apikey → Create → label "github-ci"
#   3. Add both as GitHub repo secrets (names must match exactly):
#        gh secret set CI_DATABASE_URL   # paste pooled Neon URL
#        gh secret set CI_GOOGLE_API_KEY # paste AIza key
#   4. Manually trigger to verify before waiting for 07:00 UTC:
#        gh workflow run rag-golden-nightly
#        gh run watch  # or: gh run list --workflow=rag-golden-nightly
#
# Env var note: the Gemini client reads GEMINI_API_KEY || GOOGLE_API_KEY
# (src/lib/gemini-client.ts:15), so either env name works; this workflow
# uses GOOGLE_API_KEY historically.
#
# Rollback: `gh secret delete CI_DATABASE_URL` + `gh secret delete
# CI_GOOGLE_API_KEY`. Workflow keeps running nightly, but the test's
# defensive env check (rag-golden-questions.test.ts:100-109) will fail
# visibly in the Actions tab — no silent break. Optionally also delete
# the Neon `ci` branch + revoke the Gemini key in AI Studio.

name: rag-golden-nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# Prevent a manual `gh workflow run` from stacking on top of the 07:00
# UTC scheduled run and wasting Gemini quota on duplicate work. Both
# requests queue instead of running in parallel; neither is cancelled.
concurrency:
  group: rag-golden
  cancel-in-progress: false

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run RAG golden regression suite
        env:
          RUN_RAG_GOLDEN: "1"
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.CI_GOOGLE_API_KEY }}
        run: npm run test:run -- tests/api/rag-golden-questions
