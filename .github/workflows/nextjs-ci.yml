name: nextjs-ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repo. Stated explicitly so the job keeps a
# read-only token even if the repository default is ever widened.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a commit SHA: a tag like @v4 is
      # mutable, so whoever controls it controls what runs in CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Test type check
        run: npm run test:typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test:run

      # next build runs in the e2e job below, which has its own database.

  # Production build, then the Chromium desktop and mobile specs against it.
  # Firefox and WebKit smoke stay local. The specs mock the /api calls they
  # exercise, so no AI key is needed; the pages still read the database: a
  # throwaway Postgres seeded with the three editions the specs visit, so the
  # job needs no secret and runs on fork and Dependabot PRs too.
  e2e:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # pgvector/pgvector:pg17, pinned by digest like the actions above.
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transcript
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transcript"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # localhost URLs reach Postgres through the neon-http-shim, which the
      # db scripts and scripts/dev/with-local-db.mjs start (src/lib/sql.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/transcript
      # The seed writes image URLs on the public R2 bucket, as production
      # does; the fixtures carry no image files.
      IMAGE_BASE_URL: https://pub-6b4b0bceb63e48c1af6578ad09beb2e5.r2.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Database
        run: |
          npm run db:migrate
          npm run db:seed -- --editions-dir tests/fixtures/ci-editions

      - name: Production build
        run: node scripts/dev/with-local-db.mjs npm run build

      - name: Browser tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_SERVER_MODE: production
        run: |
          node scripts/dev/with-local-db.mjs npm run start -- --hostname 127.0.0.1 --port 3000 > next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          # The edition sweep visits every published edition on a two-hour
          # budget; it is an audit run, not a pull-request check.
          npx playwright test --project=chromium-desktop --project=chromium-mobile \
            --grep-invert "reconciles and sweeps the complete production/local edition union"

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            audit-evidence/full/after/harness/test-run/all-projects/
            next-start.log
          retention-days: 7
