name: nextjs-ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repo. Stated explicitly so the job keeps a
# read-only token even if the repository default is ever widened.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a commit SHA: a tag like @v4 is
      # mutable, so whoever controls it controls what runs in CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test:run

      # npm run build intentionally not included here — it requires
      # DATABASE_URL to pre-render edition pages via generateStaticParams
      # (see CLAUDE.md Build and Caching). Closes docs/issues/0004 for
      # the tsc/lint/test surface; the build gate is a follow-up that
      # needs a CI_DATABASE_URL secret wired up first.
