name: nextjs-ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repo. Stated explicitly so the job keeps a
# read-only token even if the repository default is ever widened.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a commit SHA: a tag like @v4 is
      # mutable, so whoever controls it controls what runs in CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test:run

      # next build runs in the e2e job below. Every page's layout reads the
      # editions table, so the production server needs a database, which
      # fork PRs and a repository without the secret don't have.

  # Secrets can't be read in a job-level `if`, so whether the browser tests
  # can run is decided here. Dependabot PRs read Dependabot secrets, not
  # Actions secrets, so they skip too unless the secret is added there.
  e2e-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CI_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: |
          if [ -n "$CI_DATABASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Browser tests skipped::Add a CI_DATABASE_URL repository secret (a Neon branch of the production database) to run them."
          fi

  # Production build, then the Chromium desktop and mobile specs against it.
  # Firefox and WebKit smoke stay local. The specs mock the /api calls they
  # exercise, so no AI key is needed; the pages still read the database.
  e2e:
    needs: [verify, e2e-gate]
    if: needs.e2e-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Browser tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_SERVER_MODE: production
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          # The edition sweep visits every published edition on a two-hour
          # budget; it is an audit run, not a pull-request check.
          npx playwright test --project=chromium-desktop --project=chromium-mobile \
            --grep-invert "reconciles and sweeps the complete production/local edition union"

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            audit-evidence/full/after/harness/test-run/all-projects/
            next-start.log
          retention-days: 7
