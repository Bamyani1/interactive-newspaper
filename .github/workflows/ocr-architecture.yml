name: OCR Architecture

on:
  pull_request:
  push:
    branches:
      - main

# Nothing here writes to the repo. Stated explicitly so the job keeps a
# read-only token even if the repository default is ever widened.
permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a commit SHA: a tag like @v4 is
      # mutable, so whoever controls it controls what runs in CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run import boundary tests
        run: |
          pytest -q \
            tests/ocr/architecture/test_import_rules.py \
            tests/ocr/architecture/test_wrapper_entrypoints.py \
            tests/ocr/architecture/test_runtime_cutover.py

      - name: Validate script targets exist
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          required = [
              root / 'ocr' / 'convert_scans.py',
              root / 'ocr' / 'log_failure.py',
              root / 'ocr' / 'score_gold.py',
              root / 'ocr' / 'validate_candidate.py',
              root / 'scripts' / 'dev' / 'compare_runs.py',
              root / 'scripts' / 'ocr' / 'process-edition.sh',
              root / 'scripts' / 'ocr' / 'process-unprocessed.sh',
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f"Missing required scripts: {missing}")
          print('Script target validation passed')
          PY
