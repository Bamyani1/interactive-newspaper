version: 2

# Grouped and monthly on purpose: this is a single-maintainer repo, and a
# daily stream of individual PRs gets ignored, which is worse than no alerts.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Framework majors land together or not at all — next and
      # eslint-config-next are version-locked to each other.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  # Keeps the SHA pins in .github/workflows/ current instead of frozen.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: "/ocr"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
